{% extends "base.html" %}
{% block title %}403 Forbidden{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="display-1 fw-bold text-danger opacity-25">403</div>
    <h2 class="fw-bold mt-2">Access Denied</h2>
    <p class="text-muted lead">You don't have permission to access this page.</p>
    <div class="d-flex justify-content-center gap-3 mt-4">
      <a href="javascript:history.back()" class="btn btn-outline-secondary">Go Back</a>
      <a href="{{ url_for('dashboard.home') }}" class="btn btn-primary">Dashboard</a>
    </div>
  </div>
</div>
{% endblock %}
