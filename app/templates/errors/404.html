{% extends "base.html" %}
{% block title %}404 Not Found{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="display-1 fw-bold text-primary opacity-25">404</div>
    <h2 class="fw-bold mt-2">Page Not Found</h2>
    <p class="text-muted lead">The page you're looking for doesn't exist or has been moved.</p>
    <div class="d-flex justify-content-center gap-3 mt-4">
      <a href="javascript:history.back()" class="btn btn-outline-secondary">Go Back</a>
      <a href="{{ url_for('auth.index') }}" class="btn btn-primary">Go Home</a>
    </div>
  </div>
</div>
{% endblock %}
