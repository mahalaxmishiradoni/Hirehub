{% extends "base.html" %}
{% block title %}500 Server Error{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="display-1 fw-bold text-secondary opacity-25">500</div>
    <h2 class="fw-bold mt-2">Internal Server Error</h2>
    <p class="text-muted lead">Something went wrong on our end. Please try again later.</p>
    <a href="{{ url_for('auth.index') }}" class="btn btn-primary mt-2">Go Home</a>
  </div>
</div>
{% endblock %}
