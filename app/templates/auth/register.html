{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <i class="bi bi-person-plus-fill text-primary fs-1"></i>
            <h2 class="fw-bold mt-2">Create Account</h2>
            <p class="text-muted">Join HireHub today</p>
          </div>

          <!-- Role tabs -->
          <ul class="nav nav-pills justify-content-center mb-4" id="roleTab">
            <li class="nav-item">
              <a class="nav-link {% if role != 'RECRUITER' %}active{% endif %}" href="{{ url_for('auth.register') }}?role=candidate">
                <i class="bi bi-person me-1"></i>Candidate
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if role == 'RECRUITER' %}active{% endif %}" href="{{ url_for('auth.register') }}?role=recruiter">
                <i class="bi bi-building me-1"></i>Recruiter
              </a>
            </li>
          </ul>

          <form method="POST" action="{{ url_for('auth.register') }}" novalidate>
            <input type="hidden" name="role" value="{{ role }}">

            <div class="mb-3">
              <label class="form-label fw-semibold">Full Name</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" name="name" placeholder="Your full name" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" name="email" placeholder="you@example.com" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Phone Number</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                <input type="tel" class="form-control" name="phone" placeholder="10-15 digit phone number" required>
              </div>
            </div>

            {% if role == 'RECRUITER' %}
            <div class="mb-3">
              <label class="form-label fw-semibold">Company Name</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-building"></i></span>
                <input type="text" class="form-control" name="company_name" placeholder="Your company name" required>
              </div>
            </div>
            {% endif %}

            <div class="mb-3">
              <label class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" name="password" placeholder="Minimum 8 characters" required>
                <button class="btn btn-outline-secondary" type="button" id="togglePwd" tabindex="-1">
                  <i class="bi bi-eye" id="togglePwdIcon"></i>
                </button>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold">Confirm Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" class="form-control" name="confirm_password" placeholder="Repeat your password" required>
              </div>
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg fw-semibold">
                <i class="bi bi-person-check me-2"></i>Create Account
              </button>
            </div>
          </form>
          <hr class="my-4">
          <p class="text-center mb-0 text-muted small">
            Already have an account?
            <a href="{{ url_for('auth.login') }}" class="fw-semibold text-decoration-none">Sign in</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('togglePwd').addEventListener('click', function() {
  const pwd = document.getElementById('password');
  const icon = document.getElementById('togglePwdIcon');
  if (pwd.type === 'password') { pwd.type = 'text'; icon.className = 'bi bi-eye-slash'; }
  else { pwd.type = 'password'; icon.className = 'bi bi-eye'; }
});
</script>
{% endblock %}
