{% extends "base.html" %}
{% block title %}Edit Recruiter Profile{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="d-flex align-items-center gap-3 mb-4">
        <a href="{{ url_for('recruiter.profile') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i></a>
        <h3 class="fw-bold mb-0">Edit Profile</h3>
      </div>
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <form method="POST" action="{{ url_for('recruiter.edit_profile') }}">
            <div class="mb-3">
              <label class="form-label fw-semibold">Full Name</label>
              <input type="text" name="name" class="form-control" value="{{ recruiter.get('name','') }}" required>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Phone Number</label>
              <input type="tel" name="phone" class="form-control" value="{{ recruiter.get('phone','') }}">
            </div>
            <div class="d-flex gap-3">
              <button type="submit" class="btn btn-primary px-4">Save Changes</button>
              <a href="{{ url_for('recruiter.profile') }}" class="btn btn-outline-secondary px-4">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
