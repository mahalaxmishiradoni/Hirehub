{% extends "base.html" %}
{% block title %}Schedule Interview{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="d-flex align-items-center gap-3 mb-4">
        <a href="{{ url_for('recruiter.my_jobs') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i></a>
        <h3 class="fw-bold mb-0">Schedule Interview</h3>
      </div>
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <form method="POST" action="{{ url_for('recruiter.schedule_interview', app_id=app_id) }}">
            <div class="mb-3">
              <label class="form-label fw-semibold">Interview Type <span class="text-danger">*</span></label>
              <select name="type" class="form-select" required>
                <option value="ONLINE">Online (Video Call)</option>
                <option value="PHONE">Phone</option>
                <option value="IN_PERSON">In Person</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Date <span class="text-danger">*</span></label>
              <input type="date" name="date" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Time <span class="text-danger">*</span></label>
              <input type="time" name="time" class="form-control" required>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Meeting Link</label>
              <input type="url" name="meeting_link" class="form-control" placeholder="https://meet.google.com/...">
              <div class="form-text">Required for Online interviews.</div>
            </div>
            <div class="d-flex gap-3">
              <button type="submit" class="btn btn-success px-4 fw-semibold">
                <i class="bi bi-calendar-check me-2"></i>Schedule Interview
              </button>
              <a href="{{ url_for('recruiter.my_jobs') }}" class="btn btn-outline-secondary px-4">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
