{% extends "base.html" %}
{% block title %}Edit Job{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="d-flex align-items-center gap-3 mb-4">
        <a href="{{ url_for('recruiter.my_jobs') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i></a>
        <h3 class="fw-bold mb-0">Edit Job</h3>
      </div>
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <form method="POST" action="{{ url_for('recruiter.edit_job', job_id=job.get('_id','')) }}">
            <div class="row g-3 mb-4">
              <div class="col-12">
                <label class="form-label fw-semibold">Job Title <span class="text-danger">*</span></label>
                <input type="text" name="title" class="form-control" value="{{ job.get('title','') }}" required>
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold">Description <span class="text-danger">*</span></label>
                <textarea name="description" class="form-control" rows="6" required>{{ job.get('description','') }}</textarea>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Location <span class="text-danger">*</span></label>
                <input type="text" name="location" class="form-control" value="{{ job.get('location','') }}" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Work Mode</label>
                <select name="work_mode" class="form-select">
                  {% for wm in ['ONSITE','REMOTE','HYBRID'] %}
                  <option value="{{ wm }}" {% if job.get('work_mode') == wm %}selected{% endif %}>{{ wm.title() }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Employment Type</label>
                <select name="employment_type" class="form-select">
                  {% for et in ['FULL_TIME','PART_TIME','INTERNSHIP','CONTRACT'] %}
                  <option value="{{ et }}" {% if job.get('employment_type') == et %}selected{% endif %}>{{ et.replace('_',' ').title() }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Deadline</label>
                <input type="date" name="deadline" class="form-control" value="{{ job.get('deadline','')[:10] if job.get('deadline') else '' }}">
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold">Skills</label>
                <input type="text" name="skills" class="form-control" value="{{ job.get('skills',[])|join(', ') }}" placeholder="python, django…">
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold">Min Exp (yrs)</label>
                <input type="number" name="experience_min" class="form-control" value="{{ job.get('experience_min',0) }}" min="0">
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold">Max Exp (yrs)</label>
                <input type="number" name="experience_max" class="form-control" value="{{ job.get('experience_max',0) }}" min="0">
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold">Min Salary</label>
                <input type="number" name="salary_min" class="form-control" value="{{ job.get('salary_min',0)|int }}">
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold">Max Salary</label>
                <input type="number" name="salary_max" class="form-control" value="{{ job.get('salary_max',0)|int }}">
              </div>
            </div>
            <div class="d-flex gap-3">
              <button type="submit" class="btn btn-primary px-4">Save Changes</button>
              <a href="{{ url_for('recruiter.my_jobs') }}" class="btn btn-outline-secondary px-4">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
