{% extends "base.html" %}
{% block title %}Upload Resume{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="d-flex align-items-center gap-3 mb-4">
        <a href="{{ url_for('candidate.profile') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i></a>
        <h3 class="fw-bold mb-0">Upload Resume</h3>
      </div>
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <div class="upload-area text-center p-4 mb-4 rounded-3 border border-dashed" id="dropzone">
            <i class="bi bi-cloud-upload text-primary" style="font-size:3rem;"></i>
            <h5 class="mt-3">Drag & drop or click to upload</h5>
            <p class="text-muted small">Supported formats: PDF, DOC, DOCX · Max 5 MB</p>
          </div>
          <form method="POST" action="{{ url_for('candidate.upload_resume') }}" enctype="multipart/form-data">
            <div class="mb-4">
              <label class="form-label fw-semibold">Select Resume File</label>
              <input type="file" name="resume" id="resumeFile" class="form-control" accept=".pdf,.doc,.docx" required>
              <div class="form-text">PDF, DOC, or DOCX — maximum 5 MB.</div>
            </div>
            <div id="filePreview" class="alert alert-info d-none mb-3 py-2"></div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary fw-semibold">
                <i class="bi bi-upload me-2"></i>Upload Resume
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('resumeFile').addEventListener('change', function() {
  const file = this.files[0];
  const preview = document.getElementById('filePreview');
  if (file) {
    preview.textContent = 'Selected: ' + file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';
    preview.classList.remove('d-none');
  }
});
</script>
{% endblock %}
